<html lang="en">
<head>

<style>
  :root {
    --bg: #0f1117;
    --bg2: #161b27;
    --bg3: #1e2535;
    --bg4: #252d40;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #e8eaf0;
    --muted: #8a90a2;
    --accent: #5b8def;
    --accent2: #7c5ce8;
    --gold: #f4c55a;
    --teal: #38d9b0;
    --coral: #ff6b6b;
    --green: #6bcb77;
    --tag-diagram: #1a3a6e;
    --tag-diagram-text: #7ab3f7;
    --tag-example: #2d1f5e;
    --tag-example-text: #b49ef7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; line-height: 1.6; }

  /* Header */
  .header { background: linear-gradient(135deg, #0d1b3e 0%, #1a0e3a 50%, #0d2b2a 100%); padding: 32px 24px 28px; text-align: center; border-bottom: 1px solid var(--border2); position: relative; overflow: hidden; }
  .header::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 0%, rgba(91,141,239,0.12) 0%, transparent 70%); pointer-events: none; }
  .header h1 { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
  .header .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .header .meta { display: flex; justify-content: center; gap: 24px; margin-top: 16px; flex-wrap: wrap; }
  .header .meta-item { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.06); border: 1px solid var(--border2); padding: 5px 14px; border-radius: 20px; font-size: 12px; color: var(--muted); }
  .header .meta-item span { color: var(--text); font-weight: 600; }

  /* Search & Filter Bar */
  .controls { padding: 16px 20px; background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; position: sticky; top: 0; z-index: 50; }
  .search-wrap { position: relative; flex: 1; min-width: 200px; }
  .search-wrap input { width: 100%; padding: 8px 12px 8px 34px; background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px; color: var(--text); font-size: 13px; outline: none; transition: border-color 0.2s; }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap::before { content: '🔍'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 13px; }
  .filter-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border2); background: var(--bg3); color: var(--muted); font-size: 12px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .filter-btn.active.diagram { background: var(--tag-diagram); border-color: var(--tag-diagram-text); color: var(--tag-diagram-text); }
  .filter-btn.active.example { background: var(--tag-example); border-color: var(--tag-example-text); color: var(--tag-example-text); }
  .result-count { font-size: 12px; color: var(--muted); margin-left: auto; white-space: nowrap; }

  /* Main Layout */
  .main { display: flex; gap: 0; }

  /* Unit Sidebar */
  .sidebar { width: 220px; min-width: 220px; background: var(--bg2); border-right: 1px solid var(--border); padding: 16px 0; height: calc(100vh - 145px); overflow-y: auto; position: sticky; top: 95px; }
  .sidebar-title { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; padding: 0 16px 8px; }
  .unit-btn { display: block; width: 100%; text-align: left; padding: 8px 16px; background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; transition: all 0.15s; border-left: 2px solid transparent; line-height: 1.4; }
  .unit-btn:hover { background: var(--bg3); color: var(--text); }
  .unit-btn.active { background: rgba(91,141,239,0.1); color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
  .unit-btn .u-num { display: inline-block; background: var(--bg4); color: var(--muted); font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 3px; margin-right: 6px; min-width: 24px; text-align: center; }

  /* Content */
  .content { flex: 1; overflow-y: auto; padding: 20px; }

  /* Unit Section */
  .unit-section { margin-bottom: 36px; }
  .unit-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border2); }
  .unit-badge { background: var(--accent2); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 4px; white-space: nowrap; }
  .unit-title { font-size: 16px; font-weight: 700; color: #fff; }
  .unit-weight { margin-left: auto; font-size: 11px; color: var(--muted); background: var(--bg3); padding: 2px 8px; border-radius: 4px; white-space: nowrap; }

  /* Topic Group */
  .topic-group { margin-bottom: 20px; }
  .topic-label { font-size: 11px; font-weight: 700; color: var(--teal); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .topic-label::before { content: ''; display: inline-block; width: 16px; height: 1px; background: var(--teal); }

  /* Question Card */
  .q-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; transition: border-color 0.15s; position: relative; }
  .q-card:hover { border-color: var(--border2); }
  .q-card.repeated-2 { border-left: 3px solid var(--gold); }
  .q-card.repeated-3 { border-left: 3px solid var(--teal); }
  .q-card.repeated-4 { border-left: 3px solid var(--coral); background: rgba(255,107,107,0.04); }
  .q-text { font-size: 13px; color: var(--text); line-height: 1.55; margin-bottom: 8px; }
  .q-footer { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; border: 1px solid; }
  .tag.diagram { background: var(--tag-diagram); color: var(--tag-diagram-text); border-color: rgba(122,179,247,0.3); }
  .tag.example { background: var(--tag-example); color: var(--tag-example-text); border-color: rgba(180,158,247,0.3); }
  .paper-chip { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-family: 'Courier New', monospace; background: var(--bg4); color: var(--muted); border: 1px solid var(--border); cursor: default; }
  .paper-chip:hover { color: var(--text); }
  .freq-badge { margin-left: auto; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
  .freq-4 { background: rgba(255,107,107,0.15); color: var(--coral); border: 1px solid rgba(255,107,107,0.3); }
  .freq-3 { background: rgba(56,217,176,0.12); color: var(--teal); border: 1px solid rgba(56,217,176,0.3); }
  .freq-2 { background: rgba(244,197,90,0.12); color: var(--gold); border: 1px solid rgba(244,197,90,0.3); }

  /* Summary Section */
  .summary-section { background: var(--bg2); border: 1px solid var(--border2); border-radius: 12px; padding: 24px; margin-bottom: 28px; }
  .summary-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
  .summary-title::before { content: '🏆'; }

  /* Summary Table */
  .sum-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .sum-table th { background: var(--bg4); color: var(--muted); font-weight: 600; padding: 8px 12px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .sum-table th:first-child { border-radius: 6px 0 0 0; }
  .sum-table th:last-child { border-radius: 0 6px 0 0; }
  .sum-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: top; }
  .sum-table tr:last-child td { border-bottom: none; }
  .sum-table tr:hover td { background: rgba(255,255,255,0.02); }
  .rank-num { display: inline-block; width: 24px; height: 24px; border-radius: 50%; background: var(--bg4); color: var(--muted); font-size: 11px; font-weight: 700; text-align: center; line-height: 24px; }
  .rank-num.top3 { background: var(--gold); color: #000; }

  /* Priority Section */
  .priority-section { background: var(--bg2); border: 1px solid rgba(56,217,176,0.2); border-radius: 12px; padding: 24px; margin-bottom: 28px; }
  .priority-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .priority-title::before { content: '⚡'; }
  .priority-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .priority-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .priority-card-title { font-size: 11px; font-weight: 700; color: var(--teal); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .priority-item { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; font-size: 12px; color: var(--text); line-height: 1.4; }
  .priority-item::before { content: '▸'; color: var(--accent); flex-shrink: 0; margin-top: 1px; }

  /* Empty state */
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }

  /* Hide class */
  .hidden { display: none !important; }

  @media (max-width: 700px) {
    .sidebar { display: none; }
    .priority-grid { grid-template-columns: 1fr; }
    .header .meta { gap: 10px; }
  }
</style>
</head>

let currentFilter = 'all';

function getFreqClass(freq) {
  if (freq >= 4) return 'repeated-4';
  if (freq >= 3) return 'repeated-3';
  if (freq >= 2) return 'repeated-2';
  return '';
}

function getFreqBadge(freq) {
  if (freq >= 4) return `<span class="freq-badge freq-4">🔥 ${freq}x asked</span>`;
  if (freq >= 3) return `<span class="freq-badge freq-3">⭐ ${freq}x asked</span>`;
  if (freq >= 2) return `<span class="freq-badge freq-2">🔁 ${freq}x asked</span>`;
  return '';
}

function renderQuestion(q) {
  const hasDiagram = q.tags.includes('DIAGRAM');
  const hasExample = q.tags.includes('EXAMPLE');
  const marks7 = q.papers.some(p => p.includes('7M'));
  const freqClass = getFreqClass(q.freq);
  const freqBadge = getFreqBadge(q.freq);
  
  const tagHtml = q.tags.map(t => {
    if (t === 'DIAGRAM') return `<span class="tag diagram">📐 DIAGRAM</span>`;
    if (t === 'EXAMPLE') return `<span class="tag example">💡 EXAMPLE</span>`;
    return '';
  }).join('');
  
  const chipHtml = q.papers.map(p => `<span class="paper-chip">${p}</span>`).join('');
  
  return `<div class="q-card ${freqClass}" data-tags="${q.tags.join(',').toLowerCase()}" data-freq="${q.freq}" data-marks="${marks7 ? '7' : ''}">
    <div class="q-text">${q.text}</div>
    <div class="q-footer">${tagHtml}${chipHtml}${freqBadge}</div>
  </div>`;
}

function renderSummary() {
  const tableRows = DATA.mostRepeated.map(r => {
    const tagHtml = r.tags.map(t => {
      if (t === 'DIAGRAM') return `<span class="tag diagram" style="font-size:10px;padding:1px 6px">📐 DIAGRAM</span>`;
      if (t === 'EXAMPLE') return `<span class="tag example" style="font-size:10px;padding:1px 6px">💡 EXAMPLE</span>`;
      return '';
    }).join(' ');
    const rankClass = r.rank <= 3 ? 'top3' : '';
    const freqColor = r.freq === '4x' ? 'var(--coral)' : r.freq === '3x' ? 'var(--teal)' : 'var(--gold)';
    return `<tr>
      <td><span class="rank-num ${rankClass}">${r.rank}</span></td>
      <td>${r.q} ${tagHtml}</td>
      <td style="color:${freqColor};font-weight:700">${r.freq}</td>
      <td style="color:var(--muted)">${r.years}</td>
      <td><span class="paper-chip">${r.marks}</span></td>

  const priority = [

function renderAll() {
  const content = document.getElementById('main-content');
  let html = '';
  
  DATA.units.forEach(unit => {
    let topicsHtml = '';
    unit.topics.forEach(topic => {
      const qHtml = topic.questions.map(q => renderQuestion(q)).join('');
      topicsHtml += `<div class="topic-group"><div class="topic-label">${topic.name}</div>${qHtml}</div>`;
    });
    html += `<div class="unit-section" id="${unit.id}">
      <div class="unit-header">
        <span class="unit-badge">Unit ${unit.num}</span>
        <span class="unit-title">${unit.name}</span>
        <span class="unit-weight">${unit.weight} Weightage</span>
      </div>
      ${topicsHtml}
    </div>`;
  });
  
  html += renderSummary();
  content.innerHTML = html;
  
  // count total questions
  const total = DATA.units.reduce((acc, u) => acc + u.topics.reduce((a, t) => a + t.questions.length, 0), 0);
  document.getElementById('total-q').textContent = total + ' questions';
  
  applyFilters();
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  
  if (filter === 'summary') {
    document.querySelectorAll('.unit-section').forEach(s => s.classList.add('hidden'));
    document.querySelector('.summary-section')?.classList.remove('hidden');
    document.querySelector('.priority-section')?.classList.remove('hidden');
    document.getElementById('result-count').textContent = '';
    return;
  }
  
  document.querySelectorAll('.unit-section').forEach(s => s.classList.remove('hidden'));
  document.querySelector('.summary-section')?.classList.add('hidden');
  document.querySelector('.priority-section')?.classList.add('hidden');
  applyFilters();
}

    const marks = card.dataset.marks;
    
    let show = true;
    if (search && !text.includes(search) && !paperText.includes(search)) show = false;
    if (currentFilter === 'diagram' && !tags.includes('diagram')) show = false;
    if (currentFilter === 'example' && !tags.includes('example')) show = false;
    if (currentFilter === 'repeated' && freq < 2) show = false;
    if (currentFilter === '7m' && marks !== '7') show = false;
    
    card.classList.toggle('hidden', !show);
    if (show) visible++;
  });
  
  // Hide empty unit sections
  document.querySelectorAll('.unit-section').forEach(section => {
    const hasVisible = section.querySelector('.q-card:not(.hidden)');
    section.classList.toggle('hidden', !hasVisible);
  });
  
  document.getElementById('result-count').textContent = `${visible} questions`;
}

function scrollToUnit(id) {
  document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  
  if (id === 'all') {
    setFilter('all', document.querySelector('.filter-btn'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  if (id === 'summary') {
    setFilter('summary', document.querySelector('.filter-btn[onclick*="summary"]'));
    document.getElementById('summary')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  
  const el = document.getElementById(id);
  if (el) {
    // ensure all visible
    if (currentFilter !== 'all') {
      setFilter('all', document.querySelector('.filter-btn'));
    }
    setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
  }
}

renderAll();
</script>
</body>
</html>
